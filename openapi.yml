openapi: 3.1.0
info:
  title: Gaming (API Commons)
  version: 0.1.0-draft.20261111
  description: 'The common Gaming interface, distilled from the harvested OpenAPI of 73 providers in the APIs.io
    catalog. Not a product: no one serves this API. It is the shape the market already shares, measured, so that
    providers, agents and integrators can map to one vocabulary. See profile.yml.'
  license:
    name: CC BY-NC-SA 4.0
    url: https://creativecommons.org/licenses/by-nc-sa/4.0/
paths:
  /game-titles:
    get:
      operationId: listGameTitles
      summary: List game titles
      tags:
      - Game Titles
      x-commons-tier: core
      x-commons-share: 0.933
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: &id001
                  $ref: '#/components/schemas/GameTitle'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
      - name: cursor
        in: query
        schema:
          type: string
    post:
      operationId: createGameTitle
      summary: Create a game title
      tags:
      - Game Titles
      x-commons-tier: extended
      x-commons-share: 0.333
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema: *id001
  /game-titles/{game_title_id}:
    parameters:
    - $ref: '#/components/parameters/game_title_id'
    get:
      operationId: getGameTitle
      summary: Get a game title
      tags:
      - Game Titles
      x-commons-tier: extended
      x-commons-share: 0.4
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id001
  /player-profiles:
    get:
      operationId: listPlayerProfiles
      summary: List player profiles
      tags:
      - Player Profiles
      x-commons-tier: core
      x-commons-share: 0.857
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: &id002
                  $ref: '#/components/schemas/PlayerProfile'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
      - name: cursor
        in: query
        schema:
          type: string
  /player-profiles/{player_profile_id}:
    parameters:
    - $ref: '#/components/parameters/player_profile_id'
    get:
      operationId: getPlayerProfile
      summary: Get a player profile
      tags:
      - Player Profiles
      x-commons-tier: core
      x-commons-share: 0.571
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id002
  /leaderboards:
    get:
      operationId: listLeaderboards
      summary: List leaderboards
      tags:
      - Leaderboards
      x-commons-tier: core
      x-commons-share: 0.933
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: &id003
                  $ref: '#/components/schemas/Leaderboard'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
      - name: cursor
        in: query
        schema:
          type: string
    post:
      operationId: createLeaderboard
      summary: Create a leaderboard
      tags:
      - Leaderboards
      x-commons-tier: extended
      x-commons-share: 0.2
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id003
      requestBody:
        required: true
        content:
          application/json:
            schema: *id003
  /leaderboards/{leaderboard_id}:
    parameters:
    - $ref: '#/components/parameters/leaderboard_id'
    get:
      operationId: getLeaderboard
      summary: Get a leaderboard
      tags:
      - Leaderboards
      x-commons-tier: extended
      x-commons-share: 0.4
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id003
    delete:
      operationId: deleteLeaderboard
      summary: Delete a leaderboard
      tags:
      - Leaderboards
      x-commons-tier: extended
      x-commons-share: 0.267
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id003
    patch:
      operationId: updateLeaderboard
      summary: Update a leaderboard
      tags:
      - Leaderboards
      x-commons-tier: extended
      x-commons-share: 0.2
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id003
      requestBody:
        required: true
        content:
          application/json:
            schema: *id003
  /achievements:
    get:
      operationId: listAchievements
      summary: List achievements
      tags:
      - Achievements
      x-commons-tier: core
      x-commons-share: 1.0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Achievement'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
      - name: cursor
        in: query
        schema:
          type: string
components:
  schemas:
    GameTitle:
      $ref: ./schema/game_title.json
    PlayerProfile:
      $ref: ./schema/player_profile.json
    Leaderboard:
      $ref: ./schema/leaderboard.json
    Achievement:
      $ref: ./schema/achievement.json
  parameters:
    game_title_id:
      name: game_title_id
      in: path
      required: true
      schema:
        type: string
    player_profile_id:
      name: player_profile_id
      in: path
      required: true
      schema:
        type: string
    leaderboard_id:
      name: leaderboard_id
      in: path
      required: true
      schema:
        type: string
    achievement_id:
      name: achievement_id
      in: path
      required: true
      schema:
        type: string
